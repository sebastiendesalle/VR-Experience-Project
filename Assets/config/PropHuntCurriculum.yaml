behaviors:
  PropHuntAgent_21:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 0.02
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.05
        network_settings:
          hidden_units: 128
        learning_rate: 3.0e-4
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 2000

#CURRICULUM
environment_parameters:
  curriculum_level:
    curriculum:
      - name: Lesson0_TweeMeter
        completion_criteria:
          measure: reward
          behavior: PropHuntAgent_21
          signal_smoothing: true
          min_lesson_length: 500
          threshold: 4.5
        value: 0.0

      - name: Lesson1_VierMeter
        completion_criteria:
          measure: reward
          behavior: PropHuntAgent_21
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 4.0
        value: 1.0

      - name: Lesson2_HeleKamer
        completion_criteria:
          measure: reward
          behavior: PropHuntAgent_21
          signal_smoothing: true
          min_lesson_length: 2000
          threshold: 3.5
        value: 2.0

      - name: Lesson3_GangOversteken
        completion_criteria:
          measure: reward
          behavior: PropHuntAgent_21
          signal_smoothing: true
          min_lesson_length: 3000
          threshold: 3.0
        value: 3.0

      - name: Lesson4_FullMap
        value: 4.0
